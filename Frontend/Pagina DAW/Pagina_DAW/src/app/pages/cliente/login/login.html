<section class="login-page">

  <div class="frame">

    <div class="pad">

      <div class="brand-login">
        <i class="ti ti-parking"></i>
        <span>ParkSpot</span>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="errorMensaje" class="error-mensaje">
        {{ errorMensaje }}
      </div>

      <label class="small">Correo electrónico</label>
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="nombre@correo.com"
        (keyup.enter)="iniciarSesion()"
      >

      <label class="small">Contraseña</label>
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="••••••••••"
        (keyup.enter)="iniciarSesion()"
      >

      <div class="options">
        <span>
          <input type="checkbox" [(ngModel)]="recordarme">
          Recordarme
        </span>
        <span class="forgot">¿Olvidaste tu contraseña?</span>
      </div>

      <button
        class="btn btn-accent"
        (click)="iniciarSesion()"
        [disabled]="cargando"
      >
        {{ cargando ? 'Cargando...' : 'Iniciar sesión' }}
      </button>

      <div class="hairline"></div>

      <p class="register">
        ¿No tienes cuenta?
        <span routerLink="/registro">Regístrate</span>
      </p>

    </div>

  </div>

</section>
